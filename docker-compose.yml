version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: packready-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: packready
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d packready"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: packready-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "PackReady Core API"
      ENVIRONMENT: "development"
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@db:5432/packready"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
